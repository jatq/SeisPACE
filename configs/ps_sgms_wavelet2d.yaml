data:
  patch_size: 128
  sections: 2000

model:
  ngf: 128
  num_classes: 100
  sigma_begin: 1.0
  sigma_end: 0.01
  sigma_dist: geometric
  normalization: InstanceNorm++
  nonlinearity: elu
  ema: true
  ema_rate: 0.999

training:
  iterations: 30000
  batch_size: 8
  lr: 0.0001
  beta1: 0.9
  weight_decay: 0.0
  anneal_power: 2.0
  snapshot_freq: 5000
  seed: 42

sampling:
  step_lr: 0.0000033
  n_steps_each: 5
  num_variations: 1
