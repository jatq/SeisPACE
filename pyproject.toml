[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seispace"
version = "0.2.0"
description = "Baseline-anchored prior calibration for seismic denoising"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Xiaoming Hou" },
  { name = "Yu Zheng" },
  { name = "Shengli Zhang" },
]
keywords = ["seismology", "denoising", "deep learning", "prior calibration"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jatq/SeisPACE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
