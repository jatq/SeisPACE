[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seispace"
version = "0.1.0"
description = "Baseline-anchored prior calibration for seismic denoising"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Xiaoming Hou" },
  { name = "Yu Zheng" },
  { name = "Shengli Zhang" },
]
keywords = ["seismology", "denoising", "transformer", "prior calibration"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "h5py>=3.8",
  "segyio>=1.9",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyWavelets>=1.5",
  "curvelets>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
baselines = ["einops>=0.8", "timm>=1.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/jatq/SeisPACE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
